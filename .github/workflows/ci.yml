name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root
        run: npm install
      - name: Build root
        run: npm run build
      - name: Install apps/web
        run: npm install --prefix apps/web
      - name: Build apps/web
        run: npm run build --prefix apps/web
